spring:
  application:
    name: comms-mcp
  ai:
    mcp:
      server:
        name: comms-mcp
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

server:
  port: 8084

logging:
  level:
    com.milind.commsmcp: INFO
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG
