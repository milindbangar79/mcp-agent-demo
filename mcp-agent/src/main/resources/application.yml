# Defaults safe for all profiles. No secrets — Ollama is local and keyless.
spring:
  application:
    name: mcp-agent
  ai:
    mcp:
      client:
        enabled: true
        name: mcp-agent
        version: 0.1.0
        type: SYNC
        request-timeout: 60s          # local LLM tool loops can be slow; be generous
        streamable-http:
          connections:
            finance-mcp:              # Finance Skill — calculate_simple_interest
              url: http://localhost:8082
              endpoint: /mcp
            research-mcp:             # Research Skill — search_learning_resources
              url: http://localhost:8083
              endpoint: /mcp
            comms-mcp:                # Communication Skill — send_greeting
              url: http://localhost:8084
              endpoint: /mcp
            employee-mcp:             # Employee Skill — get_employee_details, search_employees
              url: http://localhost:8085
              endpoint: /mcp
    ollama:
      base-url: http://localhost:11434
      chat:
        # Must be a tool-calling-capable model. qwen2.5 / llama3.1 / mistral all work.
        # qwen2.5-coder emits tool calls as text, not as Ollama tool_calls API format.
        model: llama3.1:8b
        options:
          temperature: 0.2            # low temp = more reliable tool selection

server:
  port: 8080

# Agent-to-agent link. The key must match employee-agent's agent.security.api-key.
employee-agent:
  url: http://localhost:8086
  api-key: ${AGENT_SHARED_API_KEY:dev-only-shared-key}

logging:
  level:
    com.yourorg.mcpagent: INFO
    # DEBUG prints full prompts/tool payloads to the console AND to OTLP logs (Loki), bypassing mcp.audit.content.
    # Use it only for a local debugging session; the audit trail already records the LLM flow.
    org.springframework.ai: INFO
    io.modelcontextprotocol: INFO

# --- Telemetry (see ARCHITECTURE.md "Observability & Audit") -------------------------------------------
management:
  metrics:
    distribution:
      # Buckets are NOT published by default; without them histogram_quantile() (p50/p95 panels) returns NaN.
      percentiles-histogram:
        http.server.requests: true
        gen_ai.client.operation: true
        mcp.tool.call: true
        spring.ai.tool: true
      maximum-expected-value:
        http.server.requests: 120s
        gen_ai.client.operation: 120s
        spring.ai.tool: 120s
  tracing:
    sampling:
      probability: 1.0            # dev: keep everything. Prod: sample in the collector (tail sampling).
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s

mcp:
  audit:
    # full = prompts/completions/tool args+results stored in the audit sinks (dev). redacted = SHA-256 + length only.
    content: ${AUDIT_CONTENT:full}
    jdbc:
      enabled: ${AUDIT_JDBC_ENABLED:false}
      url: ${AUDIT_JDBC_URL:jdbc:postgresql://localhost:5432/audit}
      username: ${AUDIT_JDBC_USER:audit_writer}
      password: ${AUDIT_JDBC_PASSWORD:audit_writer_dev}

# Prompt/completion/tool content must NOT leak onto spans or logs via Spring AI; it goes to the audit sinks only.
spring.ai.chat.observations.log-prompt: false
spring.ai.chat.observations.log-completion: false
spring.ai.chat.observations.include-error-logging: false
spring.ai.tools.observations.include-content: false
